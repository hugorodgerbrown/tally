# Every check CI runs. `uv run tox` runs the default list; `uv run tox -e <env>`
# runs one. CI runs each env as its own job (.github/workflows/ci.yml).
[tox]
no_package = True
envlist = fmt, lint, types, checks, test, js, audit

# tox scrubs the environment; behind a TLS-inspecting proxy the tools need
# these to reach PyPI, OSV and the semgrep registry.
[testenv]
base_python = py314
passenv =
    SSL_CERT_FILE
    REQUESTS_CA_BUNDLE
    NODE_EXTRA_CA_CERTS
    *_PROXY
    *_proxy
runner = uv-venv-lock-runner
# Fail on a stale uv.lock instead of quietly re-resolving.
uv_sync_flags = --frozen

[testenv:fmt]
description = Formatting (ruff format)
dependency_groups = lint
commands = ruff format --check .

[testenv:lint]
description = Linting, import order and bandit security rules (ruff)
dependency_groups = lint
commands = ruff check .

[testenv:types]
description = Type checking (mypy + django-stubs)
dependency_groups = types
commands = mypy .

[testenv:checks]
description = Django deploy checks with production settings, and missing migrations
dependency_groups = test
setenv =
    DJANGO_DEBUG = 0
    DJANGO_SECRET_KEY = tox-checks-only-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJ
commands =
    python manage.py check --deploy --fail-level WARNING
    python manage.py makemigrations --check --dry-run

[testenv:test]
description = Python tests with coverage (fails under the floor in pyproject.toml)
dependency_groups = test
commands = pytest --cov --cov-report=term-missing:skip-covered {posargs}

[testenv:js]
description = Tests for the PWA's timer engine (Node's built-in runner, no npm)
skip_install = True
runner = virtualenv
allowlist_externals = node
commands = node --test "tests/js/*.test.mjs"

[testenv:audit]
description = Known CVEs in the production dependencies (pip-audit)
runner = virtualenv
skip_install = True
deps = pip-audit
allowlist_externals = uv
commands =
    uv export --frozen --no-dev --no-emit-project --format requirements-txt --quiet --output-file {envtmpdir}/requirements.txt
    pip-audit --disable-pip --requirement {envtmpdir}/requirements.txt

# Not in the default list: it downloads rule packs from semgrep.dev on every
# run. CI runs it on every push and weekly.
# django-no-csrf-token is excluded: it misreads exercise_edit.html, whose form
# does carry {% csrf_token %}, and CsrfViewMiddleware rejects any POST
# without one (the planner tests post through it).
[testenv:sast]
description = Static security analysis (semgrep: Django, Python and security-audit packs)
runner = virtualenv
skip_install = True
deps = semgrep
setenv =
    SEMGREP_SEND_METRICS = off
    XDG_CONFIG_HOME = {envtmpdir}
    XDG_CACHE_HOME = {envtmpdir}
commands =
    semgrep scan --config=p/django --config=p/python --config=p/security-audit \
        --exclude=.venv --exclude=.tox --exclude=migrations --exclude=tests.py \
        --exclude-rule=python.django.security.django-no-csrf-token.django-no-csrf-token \
        --error --metrics=off .
