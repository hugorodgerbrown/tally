{% extends "planner/base.html" %}
{% load static %}
{% block title %}Tally{% endblock %}
{% block body %}
<main class="home">
  <div class="home-card">
    <img class="home-icon" src="{% static 'icons/icon-192.png' %}" alt="" width="96" height="96">
    <h1>Tally</h1>
    <p class="home-tag">Interval workouts, hands free.</p>
    <div class="home-actions">
      <a class="btn btn-accent" href="{% url 'activity:app' %}">Start a workout</a>
      <a class="btn btn-quiet" href="{% url 'planner:workouts' %}">Manage workouts</a>
    </div>
    <p class="home-hint">To install Tally on your phone, open Start a workout, then add it to your Home Screen.</p>
  </div>
</main>
{% endblock %}
