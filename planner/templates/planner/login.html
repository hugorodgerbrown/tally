{% extends "planner/base.html" %}
{% block title %}Sign in · Workouts{% endblock %}
{% block body %}
<main class="auth">
  <form class="card" method="post">
    {% csrf_token %}
    <div class="brand"><i></i>Workouts</div>
    {% if form.non_field_errors %}<ul class="errorlist">{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
    <div class="field"><label for="id_username">Username</label><input type="text" name="username" id="id_username" autocomplete="username" autofocus required value="{{ form.username.value|default_if_none:'' }}"></div>
    <div class="field"><label for="id_password">Password</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit" style="justify-content:center">Sign in</button>
  </form>
</main>
{% endblock %}
